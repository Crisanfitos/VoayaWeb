services:
  - type: web
    name: voaya-api
    runtime: node
    region: oregon
    rootDir: ./
    buildCommand: npm install && npm run build --workspace=server
    startCommand: npm run start:prod --workspace=server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AGENTS_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
