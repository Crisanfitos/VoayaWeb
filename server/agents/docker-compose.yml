services:
  voaya-agents:
    build: .
    container_name: voaya-flight-agents
    ports:
      - "3003:3003"
    environment:
      - AMADEUS_API_KEY=${AMADEUS_API_KEY}
      - AMADEUS_API_SECRET=${AMADEUS_API_SECRET}
      - AMADEUS_HOSTNAME=${AMADEUS_HOSTNAME:-test}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CALLBACK_URL=${CALLBACK_URL:-http://host.docker.internal:3001/api/chats/webhook-callback}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - PORT=3003
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
